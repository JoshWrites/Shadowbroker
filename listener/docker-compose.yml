services:
  signal-archive:
    build: .
    container_name: signal-archive
    restart: unless-stopped
    ports:
      - "${ARCHIVE_PORT:-7654}:7654"
    volumes:
      - signal_data:/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7654/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  signal_data:
    driver: local
