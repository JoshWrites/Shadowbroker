# Signal Archive — Conflict Registry
#
# Each entry defines one data source. The archive will only collect
# from sources where enabled: true.
#
# Adding a new conflict = add an entry here + a collector file.
# No code changes needed to enable/disable recording.

conflicts:

  pikud_haoref:
    enabled: false
    name: "Arab-Israeli / Iran-Israel Conflict (HTTP poll — legacy)"
    signal: "pikud_alerts"
    collector: "pikud"
    description: "Oref HTTP polling — superseded by WebSocket collector"
    poll_seconds: 5
    history_poll_minutes: 30
    notes: "Disabled — pikud_haoref_ws handles live + startup backfill"

  pikud_haoref_ws:
    enabled: true
    name: "Arab-Israeli / Iran-Israel Conflict"
    signal: "pikud_alerts"
    collector: "pikud_ws"
    description: "Real-time Tzofar WebSocket push feed with Oref history backfill at startup"
    notes: "Primary collector — WS for live, Oref history once at boot to fill gaps"

  ukraine:
    enabled: true
    name: "Russian Invasion of Ukraine"
    signal: "ukraine_alerts"
    collector: "ukraine"
    description: "Oblast-level air raid and artillery alerts via alerts.in.ua"
    poll_seconds: 30
    notes: "Requires UKRAINE_ALERTS_TOKEN env var — register at devs.alerts.in.ua"

